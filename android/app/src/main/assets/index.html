<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Magic Transfer ✨</title>
<style>
  * { box-sizing: border-box; margin: 0; font-family: system-ui, sans-serif; }
  body { background: #0b0b14; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .sub { color: #9a9ab0; font-size: 13px; margin-bottom: 14px; text-align: center; }
  .card { background: #171726; border: 1px solid #2a2a40; border-radius: 16px; padding: 16px; width: 100%; max-width: 440px; }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  button { flex: 1; padding: 14px; font-size: 16px; border: 0; border-radius: 12px; background: #6c4dff; color: #fff; font-weight: 600; }
  button.ghost { background: #262640; font-weight: 400; font-size: 14px; }
  button:active { transform: scale(.98); }
  section { display: none; width: 100%; max-width: 440px; }
  section.on { display: block; }
  #photo { max-width: 100%; max-height: 46vh; display: block; margin: 0 auto; border-radius: 12px; }
  #photo.arrive { animation: arrive .8s ease; }
  @keyframes arrive { from { transform: scale(1.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .camBox { position: relative; margin-top: 12px; border-radius: 16px; overflow: hidden; background:#000; }
  video { width: 100%; display: block; }
  #status { margin-top: 12px; text-align: center; font-size: 15px; min-height: 22px; }
  #progress { height: 8px; background: #262640; border-radius: 99px; margin-top: 8px; overflow: hidden; display: none; }
  #progressBar { height: 100%; width: 0%; background: #6c4dff; transition: width .15s; }
  #qrCanvas { background: #fff; border-radius: 8px; display: block; margin: 10px auto; width: min(92vw, 400px); height: auto; image-rendering: pixelated; }
  .hint { color: #9a9ab0; font-size: 13px; text-align: center; margin-top: 10px; }
  .frameInfo { text-align:center; color:#ffd54d; font-size:14px; margin-top:6px; }
</style>
</head>
<body>
<h1>✨ Magic Transfer</h1>
<div class="sub">Na Wi-Fi, na Bluetooth, na server — photo <b>screen se camera</b> me jati hai.<br>Har QR me maximum data, tez scan ke liye optimised.</div>

<div class="card" id="home">
  <div class="row" style="margin-top:0">
    <button id="btnSend">📤 Photo bhejo</button>
    <button id="btnRecv">📥 Photo lo</button>
  </div>
  <div class="hint">Bhejne wale ki screen par bade QR frames chalenge. Lene wala camera unpar rakhega — sab frame milte hi photo hazir.</div>
</div>

<section id="stage">
  <div id="photoWrap"><img id="photo" style="display:none"></div>
  <div class="camBox" id="camBox" style="display:none">
    <video id="cam" playsinline muted></video>
  </div>
  <canvas id="qrCanvas" width="330" height="330" style="display:none"></canvas>
  <div class="frameInfo" id="frameInfo"></div>
  <div id="status">Taiyaar</div>
  <div id="progress"><div id="progressBar"></div></div>
  <div class="row">
    <button class="ghost" id="btnPick">🖼 Photo chuno</button>
    <button class="ghost" id="btnStop" style="display:none">⏹ Band karo</button>
  </div>
  <input type="file" id="file" accept="image/*" style="display:none">
  <div class="hint" id="modeHint"></div>
</section>

<script src="mp/qrcode.js"></script>
<script src="mp/zxing-browser.min.js"></script>
<script>
const $ = id => document.getElementById(id);
// Optimised: ECC level L, har frame 1600 chars — itni density ki scanner har frame
// turant pakad le (zyada ghana QR = slow scan). Frames pehle se render hoke ready
// rehte hain, loop me sirf dikhaye jate hain — isliye render bhi fast, send bhi fast.
const CHUNK = 1600;
const FRAME_MS = 110;
let frameCanvases = [], frameTimer = null;
let recv = null;                 // {total, chunks:Map}
let zxingControls = null;

function setStatus(t) { $("status").textContent = t; }
function setProgress(p) {
  $("progress").style.display = p === null ? "none" : "block";
  if (p !== null) $("progressBar").style.width = Math.round(p * 100) + "%";
}
function showCam(on) { $("camBox").style.display = on ? "block" : "none"; }
async function stopCamera() {
  try { if (zxingControls) { zxingControls.stop(); zxingControls = null; } } catch (e) {}
  const v = $("cam");
  if (v.srcObject) { v.srcObject.getTracks().forEach(t => t.stop()); v.srcObject = null; }
}

// ---------- Photo compress (WebP = JPEG se ~30% chhota = kam frame = tez) ----------
function compressPhoto(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const maxSide = 900;
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      let type = "image/webp";
      let q = 0.78, url = c.toDataURL(type, q);
      if (!url.startsWith("data:image/webp")) { type = "image/jpeg"; url = c.toDataURL(type, q); }
      while (url.length > 80000 && q > 0.3) { q -= 0.1; url = c.toDataURL(type, q); }
      resolve({ b64: url.split(",")[1], mime: type });
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

// ---------- SEND: saare frame PEHLE render, phir sirf dikhao (fast render) ----------
function renderFrame(text) {
  const qr = qrcode(0, "L");           // 'L' = sabse zyada data capacity
  qr.addData(text, "Byte");
  qr.make();
  const n = qr.getModuleCount(), cell = 3, size = cell * (n + 2);
  const cv = document.createElement("canvas");
  cv.width = size; cv.height = size;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = "#000";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
    if (qr.isDark(r, c)) ctx.fillRect((c + 1) * cell, (r + 1) * cell, cell, cell);
  return cv;
}
async function startSend(b64, mime) {
  const payload = (mime === "image/webp" ? "w" : "j") + b64; // pehla akshar = photo type
  const chunks = [];
  for (let i = 0; i < payload.length; i += CHUNK) chunks.push(payload.substring(i, i + CHUNK));
  // Har frame khud me total batata hai — alag header frame ki zaroorat nahi
  const texts = chunks.map((c, i) => `MT2|${i}/${chunks.length}|${c}`);
  frameCanvases = [];
  setProgress(0);
  for (let i = 0; i < texts.length; i++) {
    frameCanvases.push(renderFrame(texts[i]));
    setProgress((i + 1) / texts.length);
    setStatus(`Frames taiyaar ho rahe hain… ${i + 1}/${texts.length}`);
    if (i % 4 === 3) await new Promise(r => setTimeout(r, 0)); // UI ko saans lene do
  }
  setProgress(null);
  startQRLoop();
}
function startQRLoop() {
  const cv = $("qrCanvas"), ctx = cv.getContext("2d");
  cv.style.display = "block";
  $("btnStop").style.display = "block";
  let tick = 0;
  const draw = () => {
    const idx = tick % frameCanvases.length;
    const src = frameCanvases[idx];
    if (cv.width !== src.width) { cv.width = src.width; cv.height = src.height; }
    ctx.drawImage(src, 0, 0);
    $("frameInfo").textContent = `Frame ${idx + 1} / ${frameCanvases.length}`;
    tick++;
  };
  draw();
  frameTimer = setInterval(draw, FRAME_MS);
  setStatus("📡 QR chalu hai — dusre phone par 'Photo lo' kholo, camera is screen par rakho. Waha 100% hote hi yaha Band karo dabao.");
}
function stopQRLoop() {
  if (frameTimer) { clearInterval(frameTimer); frameTimer = null; }
  $("qrCanvas").style.display = "none"; $("frameInfo").textContent = "";
  $("btnStop").style.display = "none";
}

// ---------- RECEIVE ----------
async function startReceive() {
  recv = { total: 0, chunks: new Map() };
  showCam(true);
  setStatus("📷 Bhejne wale phone ki screen par camera rakho…");
  setProgress(0);
  const hints = new Map();
  hints.set(ZXingBrowser.DecodeHintType.POSSIBLE_FORMATS, [ZXingBrowser.BarcodeFormat.QR_CODE]);
  const reader = new ZXingBrowser.BrowserQRCodeReader(hints, {
    delayBetweenScanAttempts: 50,
    delayBetweenScanSuccess: 10
  });
  try {
    zxingControls = await reader.decodeFromVideoDevice(null, $("cam"), (result) => {
      if (!result || !recv) return;
      const text = result.getText();
      if (!text.startsWith("MT2|")) return;
      const p1 = text.indexOf("|", 4), p2 = text.indexOf("|", p1 + 1);
      if (p1 < 0 || p2 < 0) return;
      const meta = text.substring(4, p1).split("/");
      const idx = parseInt(meta[0], 10), total = parseInt(meta[1], 10);
      if (isNaN(idx) || isNaN(total) || recv.chunks.has(idx)) return;
      recv.total = total;
      recv.chunks.set(idx, text.substring(p2 + 1));
      setProgress(recv.chunks.size / recv.total);
      setStatus(`Mil rahe hain… ${recv.chunks.size}/${recv.total}`);
      if (recv.chunks.size >= recv.total) finishReceive();
    });
  } catch (e) { setStatus("❌ Camera khul nahi paya: " + e.message); }
}
async function finishReceive() {
  const state = recv; recv = null;
  await stopCamera(); showCam(false); setProgress(null);
  let payload = "";
  for (let i = 0; i < state.total; i++) payload += state.chunks.get(i) || "";
  const mime = payload[0] === "w" ? "image/webp" : "image/jpeg";
  const b64 = payload.slice(1);
  const img = $("photo");
  img.src = `data:${mime};base64,` + b64;
  img.style.display = "block";
  img.classList.remove("arrive"); void img.offsetWidth; img.classList.add("arrive");
  setStatus("🎩 Photo hazir! Gallery me save kar raha hu…");
  try { window.AndroidSave.saveImage(b64, mime); } catch (e) {}
}

// ---------- Wiring ----------
function enter(m) {
  $("home").style.display = "none";
  $("stage").classList.add("on");
  $("btnPick").style.display = m === "send" ? "block" : "none";
  $("modeHint").textContent = m === "send"
    ? "Photo chuno — QR apne aap chal padega. Brightness full rakho, phone hilao mat."
    : "Camera bhejne wale ki screen par rakho — 100% hote hi photo khul jayegi aur gallery me save ho jayegi.";
  if (m === "recv") startReceive();
  else setStatus("Photo chuno");
}
$("btnSend").onclick = () => enter("send");
$("btnRecv").onclick = () => enter("recv");
$("btnPick").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  setStatus("Photo taiyaar kar raha hu…");
  const { b64, mime } = await compressPhoto(f);
  const img = $("photo");
  img.src = `data:${mime};base64,` + b64;
  img.style.display = "block";
  setStatus(`Photo ready (~${Math.round(b64.length * 0.75 / 1024)} KB)`);
  startSend(b64, mime);
};
$("btnStop").onclick = () => { stopQRLoop(); setStatus("Band kar diya."); };
</script>
</body>
</html>
